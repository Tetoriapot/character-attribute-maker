name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - 'tier-atelier/**/*.md'
      - 'tier-atelier/docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - run: npm install --global pnpm@11.25.0

      - run: pnpm install --frozen-lockfile
        working-directory: tier-atelier

      - name: Check types, lint and unit tests
        working-directory: tier-atelier
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Install Chromium
        working-directory: tier-atelier
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression tests
        working-directory: tier-atelier
        run: |
          mkdir -p .qa
          pnpm test:e2e --workers=2

      - name: Offline and update tests
        working-directory: tier-atelier
        run: pnpm test:pwa

      - name: Production build
        working-directory: tier-atelier
        run: pnpm build

      - name: Preserve existing site and add Tier Atelier
        run: |
          mkdir -p .pages/tier-atelier
          cp -a character-attribute-maker/. .pages/
          cp -a tier-atelier/dist/. .pages/tier-atelier/

      - name: Save failed browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: |
            tier-atelier/test-results/
            tier-atelier/.qa/pwa-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
